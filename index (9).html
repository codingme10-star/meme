<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الجدول الأسبوعي الذكي - ليلة النجوم</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Orbitron:wght@700;900&display=swap');

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 25px 15px;
            font-family: 'Cairo', sans-serif;
            background: #030b1e url('c56335e0d4339b5b1d013e66225f755f.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* رسالة تهنئة الأسبوع */
        #weekly-congrats {
            display: none;
            width: 100%;
            max-width: 900px;
            background: linear-gradient(135deg, #166534, #15803d);
            border: 3px solid #ffe67b;
            color: #fff;
            padding: 15px;
            border-radius: 15px;
            font-size: 1.3rem;
            font-weight: 900;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 0 25px rgba(34, 197, 94, 0.6);
            animation: bounce 0.6s ease infinite alternate;
            z-index: 100;
        }

        @keyframes bounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-5px); }
        }

        /* عنوان الصفحة الرئيسي */
        .main-title {
            width: 100%;
            max-width: 900px;
            text-align: center;
            color: #ffe67b;
            font-size: 2.2rem;
            font-weight: 900;
            margin-bottom: 20px;
            background: rgba(3, 15, 38, 0.88);
            padding: 15px;
            border-radius: 20px;
            border: 2px solid #ffb700;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 25px rgba(255, 183, 0, 0.4);
        }

        /* حاوية الساعة والمؤقت (أفقية بجانب بعض) */
        .widgets-container {
            width: 100%;
            max-width: 900px;
            display: flex;
            gap: 20px;
            justify-content: space-between;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .widget-box {
            flex: 1;
            min-width: 280px;
            background: rgba(4, 20, 48, 0.9);
            border: 2px solid #ffaa00;
            border-radius: 20px;
            padding: 18px;
            text-align: center;
            backdrop-filter: blur(8px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.6), inset 0 0 10px rgba(255, 170, 0, 0.2);
        }

        .widget-title {
            margin: 0 0 10px 0;
            color: #ffe67b;
            font-size: 1.1rem;
            font-weight: 700;
        }

        .digital-number {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.2rem;
            font-weight: 900;
            color: #ffe67b;
            text-shadow: 0 0 12px #ffaa00, 0 0 25px #ff5500;
            letter-spacing: 2px;
            direction: ltr;
            margin: 10px 0;
        }

        .timer-controls {
            display: flex;
            gap: 8px;
            justify-content: center;
            align-items: center;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .timer-controls input {
            width: 80px;
            padding: 8px;
            background: rgba(2, 9, 23, 0.9);
            border: 1px solid #ffaa00;
            border-radius: 8px;
            color: #ffe67b;
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            text-align: center;
            outline: none;
        }

        .btn-small {
            background: linear-gradient(45deg, #ff9900, #ffe67b);
            color: #030b1e;
            border: none;
            padding: 8px 14px;
            font-size: 0.9rem;
            font-weight: 900;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-small:hover {
            transform: scale(1.05);
            box-shadow: 0 0 12px rgba(255, 230, 123, 0.8);
        }

        .btn-danger {
            background: linear-gradient(45deg, #ff3333, #ff6666);
            color: #fff;
        }

        /* شبكة عرض الكروت */
        .tasks-grid {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        /* تصميم كرت اليوم */
        .task-card {
            background: linear-gradient(135deg, rgba(4, 20, 48, 0.9), rgba(8, 30, 68, 0.85));
            border: 2px solid #ffaa00;
            border-radius: 20px;
            padding: 22px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5), 0 0 15px rgba(255, 170, 0, 0.25);
            position: relative;
            backdrop-filter: blur(6px);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 20px;
        }

        .day-content {
            flex: 1;
            min-width: 260px;
        }

        /* رأس اليوم مع مربع الصح الخاص باليوم */
        .day-header-box {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(2, 9, 23, 0.6);
            padding: 12px 18px;
            border-radius: 14px;
            border: 1px solid rgba(255, 170, 0, 0.4);
            min-width: 200px;
            justify-content: center;
        }

        .day-header-box h3 {
            color: #ffe67b;
            margin: 0;
            font-size: 1.4rem;
            text-shadow: 0 0 8px rgba(255, 170, 0, 0.8);
        }

        /* مربعات الـ Checkbox المخصصة */
        .custom-checkbox {
            appearance: none;
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            border: 2px solid #ffaa00;
            border-radius: 6px;
            background: rgba(2, 9, 23, 0.8);
            cursor: pointer;
            position: relative;
            outline: none;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .custom-checkbox:checked {
            background-color: #ffaa00;
            border-color: #ffe67b;
            box-shadow: 0 0 10px #ffaa00;
        }

        .custom-checkbox:checked::after {
            content: '✔';
            position: absolute;
            top: -2px;
            left: 4px;
            color: #030b1e;
            font-size: 15px;
            font-weight: bold;
        }

        /* مربعات يوم الأسبوع (تلقائية) */
        .day-main-checkbox {
            appearance: none;
            -webkit-appearance: none;
            width: 28px;
            height: 28px;
            border: 2px solid #22c55e;
            border-radius: 8px;
            background: rgba(2, 9, 23, 0.8);
            cursor: default;
            position: relative;
            outline: none;
        }

        .day-main-checkbox:checked {
            background-color: #22c55e;
            box-shadow: 0 0 12px #22c55e;
        }

        .day-main-checkbox:checked::after {
            content: '✔';
            position: absolute;
            top: -2px;
            left: 6px;
            color: #ffffff;
            font-size: 17px;
            font-weight: bold;
        }

        .task-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .task-item {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            font-size: 1rem;
            font-weight: 700;
            color: #e2f1ff;
        }

        .task-text {
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .custom-checkbox:checked + .task-text {
            text-decoration: line-through;
            color: #8da4c4;
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <div id="weekly-congrats">🎉 مبروك! تم الانتهاء من مهام الأسبوع بالكامل! 🌟</div>

    <h1 class="main-title">🌌 الجدول الأسبوعي الذكي - ليلة النجوم 🌌</h1>

    <!-- قسم الساعة والمؤقت -->
    <div class="widgets-container">
        <!-- مربع الساعة -->
        <div class="widget-box">
            <div class="widget-title">🕒 الساعة الآن</div>
            <div class="digital-number" id="clockDisplay">00:00:00</div>
        </div>

        <!-- مربع المؤقت (التايمر) -->
        <div class="widget-box">
            <div class="widget-title">⏳ المؤقت (التايمر)</div>
            <div class="digital-number" id="timerDisplay">00:00</div>
            <div class="timer-controls">
                <input type="number" id="timerMinutes" placeholder="دقائق" min="1" value="25">
                <button class="btn-small" onclick="startTimer()">▶ ابدأ</button>
                <button class="btn-small btn-danger" onclick="pauseTimer()">⏸ إيقاف</button>
                <button class="btn-small" style="background:#aaa;" onclick="resetTimer()">🔄 إعادة</button>
            </div>
        </div>
    </div>

    <!-- شبكة عرض الأيام والمهام -->
    <div class="tasks-grid" id="scheduleContainer"></div>

    <script>
        const scheduleData = [
            {
                day: "السبت",
                tasks: [
                    "1 ⟵ محاضرة العربي من 4 الفجر إلى 9 الصبح",
                    "2 ⟵ مذاكرة المحاضرة من 9:30 الصبح لحد 11 الظهر",
                    "3 ⟵ حل واجب المحاضرة من 11:45 الظهر لحد 3 العصر"
                ]
            },
            {
                day: "الأحد",
                tasks: [
                    "1 ⟵ محاضرة فيزياء من 4:00 الفجر لحد 9:00 الصبح",
                    "2 ⟵ مذاكرة المحاضرة من 9:30 لحد 11:30 الظهر، حل واجب المحاضرة من 11:45 لحد 3 العصر",
                    "3 ⟵ تلخيص جرامر حفظ كلمات من 3:30 لحد 6:00 المغرب",
                    "4 ⟵ حل واجب الجرامر واجب الكلمات من 6:15 لحد 8:45 الليل"
                ]
            },
            {
                day: "الاثنين",
                tasks: [
                    "1 ⟵ محاضرة الجيولوجيا من 6:00 لحد 9:00 الصبح",
                    "2 ⟵ مذاكرة المحاضرة الجيولوجيا من 9:30 لحد 11:30 الظهر",
                    "3 ⟵ حل واجب المحاضرة من 11:45 لحد 3:00 العصر + 2 مصادر"
                ]
            },
            {
                day: "الثلاثاء",
                tasks: [
                    "1 ⟵ محاضرة الكيمياء من 4:00 لحد 9:00 الصبح",
                    "2 ⟵ مذاكرة المحاضرة من 9:30 لحد 12:00 الظهر",
                    "3 ⟵ حل الواجب من 12:30 لحد 5:00 العصر ⟵ الترتيب: ك. الافتتان - م. كرة السلة"
                ]
            },
            {
                day: "الأربع",
                tasks: [
                    "1 ⟵ محاضرة فيزياء من 4:00 الفجر لحد 9:00 الصبح",
                    "2 ⟵ مذاكرة المحاضرة من 9:30 لحد 11:30 الظهر، حل واجب المحاضرة من 11:45 لحد 3 العصر",
                    "3 ⟵ تلخيص جرامر حفظ كلمات من 3:30 لحد 6:00 المغرب",
                    "4 ⟵ حل واجب الجرامر واجب الكلمات من 6:15 لحد 8:45 الليل"
                ]
            },
            {
                day: "الخميس",
                tasks: [
                    "1 ⟵ محاضرة الاحياء من 6:00 لحد 9:00 الصبح",
                    "2 ⟵ مذاكرة المحاضرة الاحياء من 9:30 لحد 11:30 الظهر",
                    "3 ⟵ حل واجب المحاضرة من 11:45 لحد 3 العصر + 2 مصادر"
                ]
            },
            {
                day: "الجمعة",
                tasks: [
                    "1 ⟵ حل مصدر التفوق كيمياء من 6:00 لحد 9:00 الصبح",
                    "2 ⟵ حل مصدر الامتحان فيزياء من 9:30 لحد 11:30",
                    "3 ⟵ حل مصدرين الامتحان والكيان عربي من 1:30 لحد 4:30 العصر",
                    "4 ⟵ حل مصدر جغري جيولوجيا واحياء من 5:00 لحد 8:00 الليل"
                ]
            }
        ];

        // 1. برمجة الساعة الحية (تم ضبطها بحيث تعرض الوقت الصحيح بعد إلغاء الفارق الزمني)
        function updateClock() {
            const now = new Date();
            now.setHours(now.getHours() + 1); // تعديل الساعة (إذا كانت متقدمة ساعة، تم ضبطها للرجوع بالوضع الطبيعي)

            let hours = now.getHours();
            let minutes = now.getMinutes();
            let seconds = now.getSeconds();

            let ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12;

            hours = hours < 10 ? '0' + hours : hours;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            seconds = seconds < 10 ? '0' + seconds : seconds;

            document.getElementById('clockDisplay').innerText = `${hours}:${minutes}:${seconds} ${ampm}`;

            checkWeeklyReset(now);
        }
        setInterval(updateClock, 1000);
        updateClock();

        // دالة تصفير المهام تلقائياً كل يوم جمعة الساعة ١٢ الليل (00:00)
        function checkWeeklyReset(currentTime) {
            const dayOfWeek = currentTime.getDay(); // 5 تعني الجمعة
            const hours = currentTime.getHours();
            const minutes = currentTime.getMinutes();

            if (dayOfWeek === 5 && hours === 0 && minutes === 0) {
                const lastResetWeek = localStorage.getItem('lastResetWeek');
                const todayDateString = currentTime.toDateString();

                if (lastResetWeek !== todayDateString) {
                    localStorage.removeItem('starryScheduleProgress');
                    localStorage.setItem('lastResetWeek', todayDateString);
                    location.reload();
                }
            }
        }

        // 2. برمجة المؤقت (Timer)
        let timerInterval = null;
        let timerSecondsLeft = 0;

        function startTimer() {
            if (timerInterval) return;

            if (timerSecondsLeft === 0) {
                const mins = parseInt(document.getElementById('timerMinutes').value);
                if (isNaN(mins) || mins <= 0) {
                    alert('من فضلك أدخل عدد دقائق صحيح!');
                    return;
                }
                timerSecondsLeft = mins * 60;
            }

            updateTimerDisplay();

            timerInterval = setInterval(() => {
                timerSecondsLeft--;
                updateTimerDisplay();

                if (timerSecondsLeft <= 0) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                    playAlarmSound();
                    setTimeout(() => alert('🔔 انتهى وقت المؤقت بنجاح! خذ استراحة الآن.'), 200);
                }
            }, 1000);
        }

        function pauseTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
        }

        function resetTimer() {
            pauseTimer();
            timerSecondsLeft = 0;
            document.getElementById('timerDisplay').innerText = "00:00";
        }

        function updateTimerDisplay() {
            let m = Math.floor(timerSecondsLeft / 60);
            let s = timerSecondsLeft % 60;
            m = m < 10 ? '0' + m : m;
            s = s < 10 ? '0' + s : s;
            document.getElementById('timerDisplay').innerText = `${m}:${s}`;
        }

        function playAlarmSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const now = audioCtx.currentTime;
                const freqs = [523.25, 659.25, 783.99, 1046.50];
                freqs.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.3, now + idx * 0.15);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.15 + 0.4);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + idx * 0.15);
                    osc.stop(now + idx * 0.15 + 0.4);
                });
            } catch(e) {}
        }

        // 3. بناء الجدول وإدارة المهام وحفظ الحالة (LocalStorage)
        window.onload = () => {
            buildScheduleUI();
            loadSavedProgress();
        };

        function buildScheduleUI() {
            const container = document.getElementById('scheduleContainer');
            container.innerHTML = '';

            scheduleData.forEach((dayObj, dayIndex) => {
                const card = document.createElement('div');
                card.className = 'task-card';

                let tasksHtml = '<div class="day-content"><ul class="task-list">';
                dayObj.tasks.forEach((taskText, taskIndex) => {
                    tasksHtml += `
                        <li class="task-item">
                            <input type="checkbox" class="custom-checkbox" id="task-${dayIndex}-${taskIndex}" onchange="handleTaskChange(${dayIndex})">
                            <label class="task-text" for="task-${dayIndex}-${taskIndex}">${taskText}</label>
                        </li>
                    `;
                });
                tasksHtml += '</ul></div>';

                let headerHtml = `
                    <div class="day-header-box">
                        <input type="checkbox" class="day-main-checkbox" id="day-box-${dayIndex}" disabled>
                        <h3>${dayObj.day}</h3>
                    </div>
                `;

                card.innerHTML = tasksHtml + headerHtml;
                container.appendChild(card);
            });
        }

        function handleTaskChange(dayIndex) {
            const dayObj = scheduleData[dayIndex];
            let allDayCompleted = true;

            dayObj.tasks.forEach((_, taskIndex) => {
                const chk = document.getElementById(`task-${dayIndex}-${taskIndex}`);
                if (!chk.checked) allDayCompleted = false;
            });

            const dayMainBox = document.getElementById(`day-box-${dayIndex}`);
            dayMainBox.checked = allDayCompleted;

            saveProgress();
            checkWeekCompletion();
        }

        function checkWeekCompletion() {
            let weekCompleted = true;
            scheduleData.forEach((_, dayIndex) => {
                const dayMainBox = document.getElementById(`day-box-${dayIndex}`);
                if (!dayMainBox.checked) weekCompleted = false;
            });

            const congratsBanner = document.getElementById('weekly-congrats');
            if (weekCompleted) {
                congratsBanner.style.display = 'block';
            } else {
                congratsBanner.style.display = 'none';
            }
        }

        function saveProgress() {
            let savedState = {};
            scheduleData.forEach((dayObj, dayIndex) => {
                dayObj.tasks.format?.();
                dayObj.tasks.forEach((_, taskIndex) => {
                    const chk = document.getElementById(`task-${dayIndex}-${taskIndex}`);
                    savedState[`task-${dayIndex}-${taskIndex}`] = chk.checked;
                });
            });
            localStorage.setItem('starryScheduleProgress', JSON.stringify(savedState));
        }

        function loadSavedProgress() {
            const saved = localStorage.getItem('starryScheduleProgress');
            if (!saved) return;
            const savedState = JSON.parse(saved);

            scheduleData.forEach((dayObj, dayIndex) => {
                dayObj.tasks.forEach((_, taskIndex) => {
                    const key = `task-${dayIndex}-${taskIndex}`;
                    if (savedState[key]) {
                        document.getElementById(key).checked = true;
                    }
                });
                handleTaskChange(dayIndex);
            });
        }
    </script>
</body>
</html>
