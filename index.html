<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الجدول الأسبوعي - ليلة مرصعة بالنجوم</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a1128;
            --card-bg: rgba(16, 28, 58, 0.85);
            --border-gold: #d4af37;
            --text-light: #f3f4f6;
            --text-gold: #fde047;
            --accent-blue: #1e3a8a;
        }

        body {
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle, #172554 0%, #030712 100%);
            color: var(--text-light);
            font-family: 'Cairo', sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* Header & Title */
        header {
            text-align: center;
            border: 3px solid var(--border-gold);
            border-radius: 15px;
            padding: 20px;
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.3);
            position: relative;
            margin-bottom: 30px;
        }

        h1 {
            font-family: 'Amiri', serif;
            font-size: 2.8rem;
            color: var(--text-gold);
            margin: 0 0 15px 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
        }

        /* Widgets Bar (Clock & Timer) */
        .widgets-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .widget-box {
            background: rgba(15, 23, 42, 0.9);
            border: 2px solid var(--border-gold);
            border-radius: 10px;
            padding: 8px 20px;
            font-size: 1.1rem;
            color: var(--text-gold);
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: inset 0 0 10px rgba(212, 175, 55, 0.2);
        }

        /* Day Card Structure */
        .day-card {
            background: var(--card-bg);
            border: 2px solid var(--border-gold);
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: md-row;
            justify-content: space-between;
            align-items: stretch;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .day-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.2);
        }

        @media (min-width: 768px) {
            .day-card {
                flex-direction: row;
            }
        }

        .tasks-section {
            flex: 1;
            padding: 20px;
            border-left: 2px dashed rgba(212, 175, 55, 0.3);
        }

        .day-title-section {
            width: 220px;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        .day-title-content {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            justify-content: center;
        }

        .day-name {
            font-family: 'Amiri', serif;
            font-size: 2rem;
            color: var(--text-gold);
            margin: 0;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }

        /* Task Item */
        .task-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 12px;
            font-size: 1.05rem;
            line-height: 1.6;
        }

        .task-item input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            border: 2px solid var(--border-gold);
            border-radius: 4px;
            outline: none;
            cursor: pointer;
            background: rgba(0,0,0,0.3);
            display: inline-block;
            position: relative;
            top: 4px;
            transition: background 0.2s;
        }

        .task-item input[type="checkbox"]:checked {
            background-color: var(--border-gold);
        }

        .task-item input[type="checkbox"]:checked::after {
            content: '✔';
            position: absolute;
            top: -2px;
            left: 3px;
            color: #030712;
            font-size: 14px;
            font-weight: bold;
        }

        .task-text {
            flex: 1;
            transition: color 0.3s, text-decoration 0.3s;
        }

        .task-item input[type="checkbox"]:checked + .task-text {
            text-decoration: line-through;
            color: #94a3b8;
            opacity: 0.7;
        }

        /* Day Checkbox Header Style */
        .day-checkbox {
            appearance: none;
            -webkit-appearance: none;
            width: 26px;
            height: 26px;
            border: 2px solid var(--border-gold);
            border-radius: 6px;
            outline: none;
            cursor: pointer;
            background: rgba(0,0,0,0.4);
            position: relative;
            transition: all 0.3s;
        }

        .day-checkbox:checked {
            background-color: #22c55e;
            border-color: #4ade80;
        }

        .day-checkbox:checked::after {
            content: '✔';
            position: absolute;
            top: -1px;
            left: 5px;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
        }

        /* Success Message Modal/Banner */
        #congrats-banner {
            display: none;
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #166534, #15803d);
            border: 3px solid #fde047;
            color: #fff;
            padding: 15px 30px;
            border-radius: 12px;
            font-size: 1.3rem;
            font-weight: bold;
            box-shadow: 0 5px 25px rgba(0,0,0,0.6);
            z-index: 1000;
            text-align: center;
            animation: bounce 0.5s ease;
        }

        @keyframes bounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-10px); }
        }

        /* Decorative stars */
        .star-dec {
            color: var(--text-gold);
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <div id="congrats-banner">🎉 مبروك! تم الانتهاء من مهام الأسبوع بالكامل! 🌟</div>

    <div class="container">
        <!-- Header -->
        <header>
            <h1>✦ الجــدول الاسـبــوعي ✦</h1>
            <div class="widgets-bar">
                <div class="widget-box" id="clock-box">
                    <span>⏰ الساعة:</span> <span id="live-clock">00:00:00</span>
                </div>
                <div class="widget-box" id="timer-box">
                    <span>⏳ التايمر:</span> <span id="timer-display">25:00</span>
                    <button onclick="toggleTimer()" id="timer-btn" style="background:var(--border-gold); border:none; padding:2px 8px; border-radius:4px; cursor:pointer; font-weight:bold;">بدء</button>
                </div>
            </div>
        </header>

        <!-- Days Container -->
        <div id="schedule-container"></div>
    </div>

    <script>
        // بيانات جدول الأسبوع المستوحاة من الصورة
        const scheduleData = [
            {
                day: "السبت",
                tasks: [
                    "1 ⟵ محاضرة العربي من 4 الفجر إلى 9 الصبح",
                    "2 ⟵ مذاكرة المحاضرة من 9:30 الصبح لحد 11 الظهر",
                    "3 ⟵ حل واجب المحاضرة من 11:45 الظهر لحد 3 العصر"
                ]
            },
            {
                day: "الأحد",
                tasks: [
                    "1 ⟵ محاضرة فيزياء من 4:00 الفجر لحد 9:00 الصبح",
                    "2 ⟵ مذاكرة المحاضرة من 9:30 لحد 11:30 الظهر، حل واجب المحاضرة من 11:45 لحد 3 العصر",
                    "3 ⟵ تلخيص جرامر حفظ كلمات من 3:30 لحد 6:00 المغرب",
                    "4 ⟵ حل واجب الجرامر واجب الكلمات من 6:15 لحد 8:45 الليل"
                ]
            },
            {
                day: "الاثنين",
                tasks: [
                    "1 ⟵ محاضرة الجيولوجيا من 6:00 لحد 9:00 الصبح",
                    "2 ⟵ مذاكرة المحاضرة الجيولوجيا من 9:30 لحد 11:30 الظهر",
                    "3 ⟵ حل واجب المحاضرة من 11:45 لحد 3:00 العصر + 2 مصادر"
                ]
            },
            {
                day: "الثلاثاء",
                tasks: [
                    "1 ⟵ محاضرة الكيمياء من 4:00 لحد 9:00 الصبح",
                    "2 ⟵ مذاكرة المحاضرة من 9:30 لحد 12:00 الظهر",
                    "3 ⟵ حل الواجب من 12:30 لحد 5:00 العصر ⟵ الترتيب: ك. الافتتان - م. كرة السلة"
                ]
            },
            {
                day: "الأربع",
                tasks: [
                    "1 ⟵ محاضرة فيزياء من 4:00 الفجر لحد 9:00 الصبح",
                    "2 ⟵ مذاكرة المحاضرة من 9:30 لحد 11:30 الظهر، حل واجب المحاضرة من 11:45 لحد 3 العصر",
                    "3 ⟵ تلخيص جرامر حفظ كلمات من 3:30 لحد 6:00 المغرب",
                    "4 ⟵ حل واجب الجرامر واجب الكلمات من 6:15 لحد 8:45 الليل"
                ]
            },
            {
                day: "الخميس",
                tasks: [
                    "1 ⟵ محاضرة الاحياء من 6:00 لحد 9:00 الصبح",
                    "2 ⟵ مذاكرة المحاضرة الاحياء من 9:30 لحد 11:30 الظهر",
                    "3 ⟵ حل واجب المحاضرة من 11:45 لحد 3 العصر + 2 مصادر"
                ]
            },
            {
                day: "الجمعة",
                tasks: [
                    "1 ⟵ حل مصدر التفوق كيمياء من 6:00 لحد 9:00 الصبح",
                    "2 ⟵ حل مصدر الامتحان فيزياء من 9:30 لحد 11:30",
                    "3 ⟵ حل مصدرين الامتحان والكيان عربي من 1:30 لحد 4:30 العصر",
                    "4 ⟵ حل مصدر جغري جيولوجيا واحياء من 5:00 لحد 8:00 الليل"
                ]
            }
        ];

        // بناء محتوى الجدول تلقائياً
        const container = document.getElementById('schedule-container');

        scheduleData.forEach((dayObj, dayIndex) => {
            const card = document.createElement('div');
            card.className = 'day-card';
            card.id = `day-card-${dayIndex}`;

            // مهام اليوم
            let tasksHtml = '<div class="tasks-section">';
            dayObj.tasks.forEach((task, taskIndex) => {
                tasksHtml += `
                    <div class="task-item">
                        <input type="checkbox" id="task-${dayIndex}-${taskIndex}" onchange="checkDayStatus(${dayIndex})">
                        <label class="task-text" for="task-${dayIndex}-${taskIndex}">${task}</label>
                    </div>
                `;
            });
            tasksHtml += '</div>';

            // عنوان اليوم مع مربع الصح الخاص به
            let titleHtml = `
                <div class="day-title-section">
                    <div class="day-title-content">
                        <input type="checkbox" class="day-checkbox" id="day-box-${dayIndex}" disabled title="يتم تحديده تلقائياً عند إتمام كافة مهام اليوم">
                        <h2 class="day-name">${dayObj.day}</h2>
                    </div>
                </div>
            `;

            card.innerHTML = tasksHtml + titleHtml;
            container.appendChild(card);
        });

        // دالة التحقق من إتمام مهام اليوم والأسبوع
        function checkDayStatus(dayIndex) {
            const dayObj = scheduleData[dayIndex];
            let allCompleted = true;

            dayObj.tasks.forEach((_, taskIndex) => {
                const checkbox = document.getElementById(`task-${dayIndex}-${taskIndex}`);
                if (!checkbox.checked) {
                    allCompleted = false;
                }
            });

            // تحديث مربع اليوم الرئيسي
            const dayBox = document.getElementById(`day-box-${dayIndex}`);
            dayBox.checked = allCompleted;

            // التحقق من إتمام كل أيام الأسبوع
            checkWeekStatus();
        }

        function checkWeekStatus() {
            let weekCompleted = true;
            scheduleData.forEach((_, dayIndex) => {
                const dayBox = document.getElementById(`day-box-${dayIndex}`);
                if (!dayBox.checked) {
                    weekCompleted = false;
                }
            });

            const banner = document.getElementById('congrats-banner');
            if (weekCompleted) {
                banner.style.display = 'block';
            } else {
                banner.style.display = 'none';
            }
        }

        // الساعة الحية
        setInterval(() => {
            const now = new Date();
            document.getElementById('live-clock').innerText = now.toLocaleTimeString('ar-EG');
        }, 1000);

        // التايمر (مؤقت بسيط بَدء/إيقاف)
        let timerInterval = null;
        let timeLeft = 25 * 60; // 25 دقيقة افتراضياً
        let timerRunning = false;

        function toggleTimer() {
            const btn = document.getElementById('timer-btn');
            const display = document.getElementById('timer-display');

            if (!timerRunning) {
                timerRunning = true;
                btn.innerText = 'إيقاف مؤقت';
                timerInterval = setInterval(() => {
                    if (timeLeft > 0) {
                        timeLeft--;
                        let minutes = Math.floor(timeLeft / 60);
                        let seconds = timeLeft % 60;
                        display.innerText = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
                    } else {
                        clearInterval(timerInterval);
                        alert('انتهى وقت التايمر! استرح قليلاً 🌟');
                        timerRunning = false;
                        btn.innerText = 'بدء';
                        timeLeft = 25 * 60;
                    }
                }, 1000);
            } else {
                timerRunning = false;
                clearInterval(timerInterval);
                btn.innerText = 'استئناف';
            }
        }
    </script>
</body>
</html>
