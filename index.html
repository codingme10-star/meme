<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منظم المهام الذكي - ليلة النجوم</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');

* {
box-sizing: border-box;
}

body {
margin: 0;
padding: 30px 15px;
font-family: 'Cairo', sans-serif;
background: #030b1e url('2052301f8dd32b0d48a802e0674441c4.jpg') no-repeat center center fixed;
background-size: cover;
color: #ffffff;
display: flex;
flex-direction: column;
align-items: center;
min-height: 100vh;
}

/* عنوان الصفحة */
.main-title {
width: 100%;
max-width: 1100px;
text-align: center;
color: #ffe67b;
font-size: 2.5rem;
font-weight: 900;
margin-bottom: 20px;
background: rgba(3, 15, 38, 0.8);
padding: 18px;
border-radius: 20px;
border: 2px solid #ffb700;
backdrop-filter: blur(8px);
box-shadow: 0 0 25px rgba(255, 183, 0, 0.4);
animation: starryGlow 3s infinite alternate ease-in-out;
}

@keyframes starryGlow {
0% { text-shadow: 0 0 10px #ffe67b, 0 0 20px #ff9900; border-color: #ffb700; }
100% { text-shadow: 0 0 25px #ffe67b, 0 0 40px #ffcc00; border-color: #ffe67b; }
}

/* حاوية إدخال المهام */
.input-section {
width: 100%;
max-width: 900px;
background: rgba(4, 20, 48, 0.88);
border: 2px solid #ffaa00;
border-radius: 20px;
padding: 20px;
margin-bottom: 30px;
backdrop-filter: blur(6px);
box-shadow: 0 10px 25px rgba(0,0,0,0.5);
transition: all 0.3s ease;
}

.input-section h2 {
margin-top: 0;
color: #ffe67b;
font-size: 1.3rem;
}

textarea {
width: 100%;
height: 150px;
background: rgba(2, 9, 23, 0.8);
border: 1px solid #ffaa00;
border-radius: 12px;
color: #fff;
padding: 15px;
font-family: 'Cairo', sans-serif;
font-size: 0.95rem;
resize: vertical;
outline: none;
}

textarea:focus {
border-color: #ffe67b;
box-shadow: 0 0 10px rgba(255, 230, 123, 0.5);
}

.btn-action {
background: linear-gradient(45deg, #ff9900, #ffe67b);
color: #030b1e;
border: none;
padding: 12px 25px;
font-size: 1.1rem;
font-weight: 900;
border-radius: 12px;
cursor: pointer;
margin-top: 15px;
transition: all 0.3s ease;
box-shadow: 0 0 15px rgba(255, 170, 0, 0.5);
}

.btn-action:hover {
transform: scale(1.05);
box-shadow: 0 0 25px rgba(255, 230, 123, 0.8);
}

/* شبكة عرض الكروت */
.tasks-grid {
width: 100%;
max-width: 1200px;
display: flex;
flex-wrap: wrap;
gap: 25px;
justify-content: center;
}

/* تصميم كرت اليوم */
.task-card {
background: linear-gradient(135deg, rgba(4, 20, 48, 0.88), rgba(8, 30, 68, 0.82));
border: 2px solid #ffaa00;
border-radius: 24px;
padding: 22px;
width: 320px;
box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5), 0 0 15px rgba(255, 170, 0, 0.25);
position: relative;
overflow: hidden;
cursor: pointer;
transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
backdrop-filter: blur(6px);
}
.task-card::before { content: '✨'; position: absolute; top: 10px; left: 12px; opacity: 0.8; }
.task-card::after { content: '🌙'; position: absolute; bottom: 10px; left: 12px; opacity: 0.6; }

.task-card:hover {
transform: translateY(-8px) scale(1.02);
box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7), 0 0 30px rgba(255, 204, 0, 0.6);
border-color: #ffe67b;
}

.task-card h3 {
color: #ffe67b;
border-bottom: 2px dashed rgba(255, 230, 123, 0.3);
padding-bottom: 12px;
margin-top: 0;
font-size: 1.25rem;
text-shadow: 0 0 8px rgba(255, 170, 0, 0.8);
}

.task-list {
list-style: none;
padding: 0;
margin: 10px 0 0 0;
line-height: 1.8;
}

.task-list li {
margin-bottom: 8px;
font-size: 0.95rem;
font-weight: 700;
color: #e2f1ff;
word-break: break-word;
}

/* غطاء الإنجاز والصح المضيء */
.checkmark-overlay {
position: absolute;
top: 0; left: 0; width: 100%; height: 100%;
background: rgba(3, 15, 38, 0.93);
display: flex;
flex-direction: column;
justify-content: center;
align-items: center;
opacity: 0;
visibility: hidden;
transition: all 0.4s ease;
z-index: 10;
border-radius: 22px;
}

.task-card.completed .checkmark-overlay {
opacity: 1;
visibility: visible;
}

.checkmark {
font-size: 100px;
color: #ffe67b;
text-shadow: 0 0 20px #ffaa00, 0 0 40px #ffaa00;
transform: scale(0) rotate(-45deg);
transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.task-card.completed .checkmark {
transform: scale(1) rotate(0deg);
}

.completed-text {
color: #ffe67b;
font-size: 1.1rem;
font-weight: bold;
margin-top: -10px;
text-shadow: 0 0 10px #ffaa00;
}

/* جزيئات النجوم المتطايرة */
.particle {
position: absolute;
pointer-events: none;
background: #ffe67b;
border-radius: 50%;
box-shadow: 0 0 10px #ffaa00;
animation: particleAnimation 0.8s forwards ease-out;
}

@keyframes particleAnimation {
0% { opacity: 1; transform: translate(0, 0) scale(1); }
100% { opacity: 0; transform: translate(var(--x), var(--y)) scale(0); }
}
</style>
</head>
<body>

<h1 class="main-title">🌌 منظم المهام الذكي - ليلة النجوم 🌌</h1>

<!-- قسم إدخال النص -->
<div class="input-section" id="inputSection">
<h2>ضع نص المهام الكامل هنا:</h2>
<textarea id="rawTaskText" placeholder="الصح واللصق للمهام بالكامل هنا..."></textarea>
<button class="btn-action" onclick="generateSchedule()">✨ ترتيب وإنشاء الجدول ✨</button>
</div>

<!-- شبكة عرض المهام المرتبة -->
<div class="tasks-grid" id="tasksContainer"></div>

<script>
// النص الافتراضي للتجربة الفورية
const defaultText = `الخميس 1/10/2026 📅
👨🏻‍💻 الجديد: محاضرة أحياء-انجلش 
📚 التراكمات:
🚀 التطوير: حل عربي(نحو -بلاغة -نصوص) 
⚡ المراجعة السريعة: 
الجمعة 2/10/2026 🌿
👨🏻‍‍💻 الجديد:عربي 
📚 التراكمات:
🚀 التطوير: حل انجلش قطعة أو ترجمة أو جرامر 
⚡ المراجعة السريعة: مراجعة عربي 
السبت 3/10/2026 📅
👨🏻‍💻 الجديد:كيمياء 
📚 التراكمات:
🚀 التطوير:حل فيزياء 
⚡ المراجعة السريعة: مراجعة جزء كيمياء`;

document.getElementById('rawTaskText').value = defaultText;

// دالة تفكيك النص وترتيب المهام في كروت
function generateSchedule() {
const rawText = document.getElementById('rawTaskText').value.trim();
const container = document.getElementById('tasksContainer');
container.innerHTML = '';
if (!rawText) {
alert('الرجاء إدخال نص المهام أولاً!');
return;
}

const lines = rawText.split('\n');
let currentCard = null;
let cardsData = [];

lines.forEach(line => {
let trimmed = line.trim();
if (!trimmed) return;

// التمييز بين عنوان اليوم وبين المهام الفرعية
const isSubTask = /^([👨🏻‍💻📚🚀⚡]|\s*-(?!\s))/i.test(trimmed) || 
trimmed.startsWith('الجديد:') || 
trimmed.startsWith('التراكمات:') || 
trimmed.startsWith('التطوير:') || 
trimmed.startsWith('المراجعة السريعة:');

if (!isSubTask) {
if (currentCard) cardsData.push(currentCard);
currentCard = { title: trimmed, items: [] };
} else {
if (!currentCard) {
currentCard = { title: '📅 جدول المهام', items: [] };
}
currentCard.items.push(trimmed);
}
});

if (currentCard) cardsData.push(currentCard);

// بناء عناصر HTML للكروت
cardsData.forEach(card => {
const cardDiv = document.createElement('div');
cardDiv.className = 'task-card';
cardDiv.onclick = (e) => toggleComplete(cardDiv, e);

let itemsHTML = card.items.map(item => `<li>${item}</li>`).join('');

cardDiv.innerHTML = `
  <div class="checkmark-overlay">
    <div class="checkmark">✔</div>
    <div class="completed-text">تم الإنجاز بنجاح! ✨</div>
  </div>
  <h3>${card.title}</h3>
  <ul class="task-list">
    ${itemsHTML}
  </ul>
`;

container.appendChild(cardDiv);
});
}

// دالة التفاعل وعلامة الصح والشرارات
function toggleComplete(card, event) {
card.classList.toggle('completed');

if (card.classList.contains('completed')) {
let rect = card.getBoundingClientRect();
for (let i = 0; i < 12; i++) {
createParticle(event.clientX - rect.left, event.clientY - rect.top, card);
}
}
}

function createParticle(x, y, parent) {
const particle = document.createElement('div');
particle.classList.add('particle');

let size = Math.random() * 8 + 4;
particle.style.width = size + 'px';
particle.style.height = size + 'px';
particle.style.left = x + 'px';
particle.style.top = y + 'px';

let destinationX = (Math.random() - 0.5) * 180;
let destinationY = (Math.random() - 0.5) * 180;

particle.style.setProperty('--x', destinationX + 'px');
particle.style.setProperty('--y', destinationY + 'px');

parent.appendChild(particle);
setTimeout(() => particle.remove(), 800);
}

// تشغيل تلقائي أول مرة عند فتح الصفحة
generateSchedule();
</script>
</body>
</html>
